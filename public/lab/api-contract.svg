<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070B12" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Header Block -->
  <g transform="translate(50, 65)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1" />
    <text x="65" y="17" fill="#38BDF8" font-family="-apple-system, monospace" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">API AUTOMATION</text>
    
    <text x="0" y="60" fill="#F8FAFC" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="-0.5">RestAssured & Postman Automated API Contract Suite</text>
    <text x="0" y="85" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">2 Years Enterprise API Automation • Dynamic JWT Token Lifecycle • JSON Schema Validation</text>
  </g>

  <!-- Architecture Flow Nodes -->
  <g transform="translate(50, 180)">
    
    <rect x="0" y="40" width="200" height="130" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="20" y="70" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">1. AUTH HANDSHAKE</text>
    <text x="20" y="95" fill="#E2E8F0" font-family="sans-serif" font-size="11">POST /api/v1/auth/login</text>
    <text x="20" y="115" fill="#94A3B8" font-family="sans-serif" font-size="10">Extract JWT Bearer Token</text>
    <text x="20" y="135" fill="#94A3B8" font-family="sans-serif" font-size="10">Inject to Global Environment</text>
    <text x="20" y="155" fill="#34D399" font-family="monospace" font-size="10">● TOKEN REFRESHED</text>

    <line x1="200" y1="105" x2="270" y2="105" stroke="#38BDF8" stroke-width="2" />
    <polygon points="265,101 275,105 265,109" fill="#38BDF8" />

    <rect x="270" y="20" width="210" height="170" rx="14" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
    <text x="290" y="50" fill="#818CF8" font-family="monospace" font-size="12" font-weight="bold">2. CONTRACT SUITE</text>
    <text x="290" y="75" fill="#E2E8F0" font-family="sans-serif" font-size="11">JSON Schema Validator</text>
    <text x="290" y="95" fill="#94A3B8" font-family="sans-serif" font-size="10">Status Code: 200 OK</text>
    <text x="290" y="115" fill="#94A3B8" font-family="sans-serif" font-size="10">Response Time &lt; 200ms</text>
    <text x="290" y="135" fill="#94A3B8" font-family="sans-serif" font-size="10">Data Boundary Checks</text>
    <rect x="290" y="145" width="170" height="24" rx="4" fill="#0F172A" />
    <text x="300" y="161" fill="#38BDF8" font-family="monospace" font-size="10">200+ AUTOMATED ENDPOINTS</text>

    <line x1="480" y1="105" x2="540" y2="105" stroke="#818CF8" stroke-width="2" />
    <polygon points="535,101 545,105 535,109" fill="#818CF8" />

    <rect x="540" y="40" width="160" height="130" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" />
    <text x="560" y="70" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">3. SECURITY & ROBUST</text>
    <text x="560" y="95" fill="#E2E8F0" font-family="sans-serif" font-size="11">Negative Payloads</text>
    <text x="560" y="115" fill="#94A3B8" font-family="sans-serif" font-size="10">401/403 Edge Cases</text>
    <text x="560" y="135" fill="#94A3B8" font-family="sans-serif" font-size="10">SQL Injection Probing</text>
    <text x="560" y="155" fill="#34D399" font-family="monospace" font-size="10">● ALL SUITES GREEN</text>
  
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(50, 520)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="8" cy="20" r="4" fill="#10B981" />
    <text x="22" y="24" fill="#94A3B8" font-family="-apple-system, monospace" font-size="11">STATUS: OPERATIONAL • MURALIDHAR YERRAM SYSTEMS ARCHITECTURE</text>
    <text x="700" y="24" fill="#38BDF8" font-family="-apple-system, monospace" font-size="11" font-weight="600" text-anchor="end">2 YRS API AUTOMATION • RESTASSURED</text>
  </g>
</svg>
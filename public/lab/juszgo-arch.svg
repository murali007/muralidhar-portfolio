<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070B12" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Header Block -->
  <g transform="translate(50, 65)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1" />
    <text x="65" y="17" fill="#38BDF8" font-family="-apple-system, monospace" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">MOBILITY ARCH</text>
    
    <text x="0" y="60" fill="#F8FAFC" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="-0.5">JuszGo Real-Time Dispatch & Geospatial Matrix</text>
    <text x="0" y="85" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">3-Sided Mobile Marketplace • H3 Hexagonal Spatial Indexing • Razorpay Cryptographic Webhooks</text>
  </g>

  <!-- Architecture Flow Nodes -->
  <g transform="translate(50, 180)">
    
    <!-- Node 1: Passenger -->
    <rect x="0" y="40" width="180" height="110" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="20" y="70" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">PASSENGER APP</text>
    <text x="20" y="92" fill="#E2E8F0" font-family="sans-serif" font-size="11">Flutter / Dart Client</text>
    <text x="20" y="112" fill="#94A3B8" font-family="sans-serif" font-size="10">Geo Coordinate Stream</text>
    <text x="20" y="130" fill="#10B981" font-family="monospace" font-size="10">● REQUEST RIDE</text>

    <!-- Connector 1 -->
    <line x1="180" y1="95" x2="260" y2="95" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="255,91 265,95 255,99" fill="#38BDF8" />

    <!-- Node 2: Core Dispatcher -->
    <rect x="260" y="10" width="200" height="170" rx="14" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
    <text x="280" y="40" fill="#818CF8" font-family="monospace" font-size="12" font-weight="bold">H3 DISPATCH ENGINE</text>
    <text x="280" y="65" fill="#E2E8F0" font-family="sans-serif" font-size="11">Geospatial Clustering</text>
    <text x="280" y="85" fill="#94A3B8" font-family="sans-serif" font-size="10">Radius Expansion (500m-3km)</text>
    <text x="280" y="105" fill="#94A3B8" font-family="sans-serif" font-size="10">Surge Pricing State Machine</text>
    <rect x="280" y="125" width="160" height="30" rx="6" fill="#0F172A" />
    <text x="290" y="145" fill="#34D399" font-family="monospace" font-size="10">SLA: SUB-2s MATCH</text>

    <!-- Connector 2 -->
    <line x1="460" y1="95" x2="520" y2="95" stroke="#818CF8" stroke-width="2" />
    <polygon points="515,91 525,95 515,99" fill="#818CF8" />

    <!-- Node 3: Captain -->
    <rect x="520" y="40" width="180" height="110" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="540" y="70" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">CAPTAIN / DRIVER</text>
    <text x="540" y="92" fill="#E2E8F0" font-family="sans-serif" font-size="11">Live Polling & Push</text>
    <text x="540" y="112" fill="#94A3B8" font-family="sans-serif" font-size="10">FCM WebSocket Tunnel</text>
    <text x="540" y="130" fill="#10B981" font-family="monospace" font-size="10">● ACCEPT & ROUTE</text>

    <!-- Sub-node: Payment Verification -->
    <rect x="260" y="210" width="200" height="80" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="280" y="235" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">RAZORPAY INTEGRATION</text>
    <text x="280" y="255" fill="#94A3B8" font-family="sans-serif" font-size="10">HMAC-SHA256 Signature Auth</text>
    <text x="280" y="272" fill="#34D399" font-family="monospace" font-size="10">● IDEMPOTENT WEBHOOKS</text>
    <line x1="360" y1="180" x2="360" y2="210" stroke="#10B981" stroke-width="1.5" />
  
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(50, 520)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="8" cy="20" r="4" fill="#10B981" />
    <text x="22" y="24" fill="#94A3B8" font-family="-apple-system, monospace" font-size="11">STATUS: OPERATIONAL • MURALIDHAR YERRAM SYSTEMS ARCHITECTURE</text>
    <text x="700" y="24" fill="#38BDF8" font-family="-apple-system, monospace" font-size="11" font-weight="600" text-anchor="end">100K+ CONCURRENCY • H3 INDEX</text>
  </g>
</svg>
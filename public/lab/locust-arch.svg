<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070B12" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Header Block -->
  <g transform="translate(50, 65)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1" />
    <text x="65" y="17" fill="#38BDF8" font-family="-apple-system, monospace" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">PERFORMANCE QA</text>
    
    <text x="0" y="60" fill="#F8FAFC" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="-0.5">Locust 1,000 Virtual Users Concurrency Test Suite</text>
    <text x="0" y="85" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">Distributed Headless Load Generator • Connection Pool Saturation • P99 Latency SLA</text>
  </g>

  <!-- Architecture Flow Nodes -->
  <g transform="translate(50, 180)">
    
    <rect x="0" y="30" width="200" height="140" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="20" y="60" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">LOCUST HEADLESS SWARM</text>
    <text x="20" y="85" fill="#E2E8F0" font-family="sans-serif" font-size="11">Python Distributed Workers</text>
    <text x="20" y="105" fill="#94A3B8" font-family="sans-serif" font-size="10">Ramp Rate: 50 users/sec</text>
    <text x="20" y="125" fill="#94A3B8" font-family="sans-serif" font-size="10">Spawn Peak: 1,000 VUs</text>
    <text x="20" y="150" fill="#34D399" font-family="monospace" font-size="11">● 100% SUCCESS RATE</text>

    <line x1="200" y1="100" x2="280" y2="100" stroke="#38BDF8" stroke-width="2" />
    <polygon points="275,96 285,100 275,104" fill="#38BDF8" />

    <rect x="280" y="30" width="200" height="140" rx="12" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
    <text x="300" y="60" fill="#818CF8" font-family="monospace" font-size="12" font-weight="bold">API GATEWAY & LOAD</text>
    <text x="300" y="85" fill="#E2E8F0" font-family="sans-serif" font-size="11">Concurrent Route Stress</text>
    <text x="300" y="105" fill="#94A3B8" font-family="sans-serif" font-size="10">POST /api/auth/token</text>
    <text x="300" y="125" fill="#94A3B8" font-family="sans-serif" font-size="10">POST /api/ride/match</text>
    <text x="300" y="150" fill="#F8FAFC" font-family="monospace" font-size="11">THROUGHPUT: 1,420 RPS</text>

    <line x1="480" y1="100" x2="540" y2="100" stroke="#818CF8" stroke-width="2" />
    <polygon points="535,96 545,100 535,104" fill="#818CF8" />

    <rect x="540" y="30" width="160" height="140" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" />
    <text x="560" y="60" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">DATABASE SLA</text>
    <text x="560" y="85" fill="#E2E8F0" font-family="sans-serif" font-size="11">PostgreSQL Pool</text>
    <text x="560" y="105" fill="#94A3B8" font-family="sans-serif" font-size="10">Max Conns: 100</text>
    <text x="560" y="125" fill="#94A3B8" font-family="sans-serif" font-size="10">Zero Deadlocks</text>
    <text x="560" y="150" fill="#34D399" font-family="monospace" font-size="11">P99: 38ms (PASS)</text>
  
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(50, 520)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="8" cy="20" r="4" fill="#10B981" />
    <text x="22" y="24" fill="#94A3B8" font-family="-apple-system, monospace" font-size="11">STATUS: OPERATIONAL • MURALIDHAR YERRAM SYSTEMS ARCHITECTURE</text>
    <text x="700" y="24" fill="#38BDF8" font-family="-apple-system, monospace" font-size="11" font-weight="600" text-anchor="end">1,000 VUs • ZERO FLAKINESS</text>
  </g>
</svg>
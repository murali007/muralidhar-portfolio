<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070B12" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Header Block -->
  <g transform="translate(50, 65)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1" />
    <text x="65" y="17" fill="#38BDF8" font-family="-apple-system, monospace" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">ENTERPRISE SAAS</text>
    
    <text x="0" y="60" fill="#F8FAFC" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="-0.5">Vikisha 5-Portal Industrial Logistics State Machine</text>
    <text x="0" y="85" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">End-to-End Enterprise Flow • PostgreSQL State Engine • Damage Proof & Thermal Barcoding</text>
  </g>

  <!-- Architecture Flow Nodes -->
  <g transform="translate(50, 180)">
    
    <rect x="0" y="50" width="120" height="90" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="15" y="80" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">1. CUSTOMER</text>
    <text x="15" y="100" fill="#E2E8F0" font-family="sans-serif" font-size="9">Booking App</text>
    <text x="15" y="120" fill="#94A3B8" font-family="sans-serif" font-size="9">Address & Time</text>

    <line x1="120" y1="95" x2="145" y2="95" stroke="#38BDF8" stroke-width="1.5" />

    <rect x="145" y="50" width="120" height="90" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="160" y="80" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">2. POS DISPATCH</text>
    <text x="160" y="100" fill="#E2E8F0" font-family="sans-serif" font-size="9">Kanban Board</text>
    <text x="160" y="120" fill="#94A3B8" font-family="sans-serif" font-size="9">Rider Assignment</text>

    <line x1="265" y1="95" x2="290" y2="95" stroke="#38BDF8" stroke-width="1.5" />

    <rect x="290" y="50" width="120" height="90" rx="8" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1" />
    <text x="305" y="80" fill="#818CF8" font-family="monospace" font-size="10" font-weight="bold">3. RIDER LOGISTICS</text>
    <text x="305" y="100" fill="#E2E8F0" font-family="sans-serif" font-size="9">Damage Photo</text>
    <text x="305" y="120" fill="#94A3B8" font-family="sans-serif" font-size="9">OTP Verification</text>

    <line x1="410" y1="95" x2="435" y2="95" stroke="#818CF8" stroke-width="1.5" />

    <rect x="435" y="50" width="120" height="90" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" />
    <text x="450" y="80" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold">4. WORKSHOP QC</text>
    <text x="450" y="100" fill="#E2E8F0" font-family="sans-serif" font-size="9">Thermal Tagging</text>
    <text x="450" y="120" fill="#94A3B8" font-family="sans-serif" font-size="9">Quality Approval</text>

    <line x1="555" y1="95" x2="580" y2="95" stroke="#10B981" stroke-width="1.5" />

    <rect x="580" y="50" width="120" height="90" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1" />
    <text x="595" y="80" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="bold">5. SUPER ADMIN</text>
    <text x="595" y="100" fill="#E2E8F0" font-family="sans-serif" font-size="9">GST Invoicing</text>
    <text x="595" y="120" fill="#94A3B8" font-family="sans-serif" font-size="9">Analytics Audit</text>
  
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(50, 520)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="8" cy="20" r="4" fill="#10B981" />
    <text x="22" y="24" fill="#94A3B8" font-family="-apple-system, monospace" font-size="11">STATUS: OPERATIONAL • MURALIDHAR YERRAM SYSTEMS ARCHITECTURE</text>
    <text x="700" y="24" fill="#38BDF8" font-family="-apple-system, monospace" font-size="11" font-weight="600" text-anchor="end">5 SYNCHRONIZED PORTALS</text>
  </g>
</svg>
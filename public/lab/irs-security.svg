<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070B12" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Header Block -->
  <g transform="translate(50, 65)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1" />
    <text x="65" y="17" fill="#38BDF8" font-family="-apple-system, monospace" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">SECURITY ENGINEERING</text>
    
    <text x="0" y="60" fill="#F8FAFC" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="-0.5">IRS Pub 4557 AES-256-GCM Cryptographic Vault</text>
    <text x="0" y="85" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">US Tax Compliance • Client-Side PII Sanitization • Supabase Row Level Security (RLS)</text>
  </g>

  <!-- Architecture Flow Nodes -->
  <g transform="translate(50, 180)">
    
    <rect x="0" y="40" width="190" height="130" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="20" y="70" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">TAXPAYER INTAKE</text>
    <text x="20" y="95" fill="#E2E8F0" font-family="sans-serif" font-size="11">Form 1040 Wizard</text>
    <text x="20" y="115" fill="#94A3B8" font-family="sans-serif" font-size="10">SSN / ITIN / Bank Details</text>
    <text x="20" y="135" fill="#94A3B8" font-family="sans-serif" font-size="10">Client-Side Sanitization</text>
    <text x="20" y="155" fill="#F59E0B" font-family="monospace" font-size="10">● UNENCRYPTED PII</text>

    <line x1="190" y1="105" x2="260" y2="105" stroke="#F59E0B" stroke-width="2" />
    <polygon points="255,101 265,105 255,109" fill="#F59E0B" />

    <rect x="260" y="20" width="220" height="170" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <text x="280" y="50" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">AES-256-GCM ENVELOPE</text>
    <text x="280" y="75" fill="#E2E8F0" font-family="sans-serif" font-size="11">IRS Pub 4557 Standards</text>
    <text x="280" y="95" fill="#94A3B8" font-family="sans-serif" font-size="10">Ciphertext + 128-bit Auth Tag</text>
    <text x="280" y="115" fill="#94A3B8" font-family="sans-serif" font-size="10">Random 96-bit IV per Record</text>
    <rect x="280" y="130" width="180" height="35" rx="4" fill="#0F172A" />
    <text x="290" y="152" fill="#34D399" font-family="monospace" font-size="10">NO PLAINTEXT STORAGE</text>

    <line x1="480" y1="105" x2="540" y2="105" stroke="#10B981" stroke-width="2" />
    <polygon points="535,101 545,105 535,109" fill="#10B981" />

    <rect x="540" y="40" width="160" height="130" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="560" y="70" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">SUPABASE RLS</text>
    <text x="560" y="95" fill="#E2E8F0" font-family="sans-serif" font-size="11">Row Level Security</text>
    <text x="560" y="115" fill="#94A3B8" font-family="sans-serif" font-size="10">Encrypted DB Columns</text>
    <text x="560" y="135" fill="#94A3B8" font-family="sans-serif" font-size="10">Zero Defect Escapes</text>
    <text x="560" y="155" fill="#34D399" font-family="monospace" font-size="10">● FULL COMPLIANCE</text>
  
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(50, 520)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="8" cy="20" r="4" fill="#10B981" />
    <text x="22" y="24" fill="#94A3B8" font-family="-apple-system, monospace" font-size="11">STATUS: OPERATIONAL • MURALIDHAR YERRAM SYSTEMS ARCHITECTURE</text>
    <text x="700" y="24" fill="#38BDF8" font-family="-apple-system, monospace" font-size="11" font-weight="600" text-anchor="end">IRS PUB 4557 • AES-256-GCM</text>
  </g>
</svg>